name: Anchor Fit CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'integration/**']

permissions:
  contents: read

concurrency:
  group: anchor-fit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable sources, lane paths and commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          branch="${HEAD_REF:-$GITHUB_REF_NAME}"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$BASE_SHA"
          elif [[ "$branch" == main ]]; then
            base="$BEFORE_SHA"
          else
            base="$(git merge-base HEAD origin/main)"
          fi
          if git cat-file -e "$base:tools/guard.py" 2>/dev/null; then
            git show "$base:tools/guard.py" > "$RUNNER_TEMP/anchor-guard.py"
            python3 "$RUNNER_TEMP/anchor-guard.py" --base "$base" --branch "$branch"
          else
            # G0 bootstraps the guard via reviewed PR against the pre-foundation main.
            # Fail closed for any other branch/base; the original ZIP verifies every byte.
            [[ "$branch" == integration/foundation || "$branch" == main ]]
            test "$base" = 46d756d89e580f76a080479c70e6f6b30c204661
            python3 tools/verify_source_archive.py
            python3 tools/guard.py
            python3 - <<'PY'
          import subprocess
          from tools.guard import message_errors
          for sha in subprocess.check_output(['git', 'rev-list', '46d756d89e580f76a080479c70e6f6b30c204661..HEAD'], text=True).splitlines():
              message = subprocess.check_output(['git', 'show', '-s', '--format=%B', sha], text=True)
              assert not message_errors(message), message_errors(message)
          PY
          fi
      - name: Verify original archive and module boundaries
        run: |
          python3 tools/verify_source_archive.py
          python3 tools/boundaries.py
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm install --global npm@11.9.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run contracts:generate && git diff --exit-code -- contracts/runtime/client.ts
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Serve production page
        run: |
          npm run start --workspace @anchor-fit/web > /tmp/anchor-web.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 > /tmp/anchor-page.html; then break; fi
            sleep 1
          done
          grep -q 'Start with one item' /tmp/anchor-page.html
  backend:
    name: backend
    needs: [security, containers]
    if: always()
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: anchor_ci
          POSTGRES_DB: anchor_fit_ci
          # Disposable local CI service; no credentials or external access.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U anchor_ci -d anchor_fit_ci"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - name: Require security and container checks
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
        run: test "$SECURITY_RESULT" = success && test "$CONTAINERS_RESULT" = success
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install uv==0.13.4
      - run: uv sync --frozen
      - run: uv run ruff check apps contracts services tools tests infra/migrations
      - run: uv run mypy
      - run: uv run python -m tools.export_contracts --check
      - run: uv run pytest -q
      - run: uv run python -m apps.worker.main --check
      - name: Empty database migration round trip
        env:
          DATABASE_URL: postgresql+psycopg://anchor_ci@127.0.0.1:5432/anchor_fit_ci
        run: |
          uv run alembic -c infra/migrations/alembic.ini upgrade head
          uv run alembic -c infra/migrations/alembic.ini current
          uv run alembic -c infra/migrations/alembic.ini downgrade base
          uv run alembic -c infra/migrations/alembic.ini upgrade head
      - name: API boot
        run: |
          uv run uvicorn apps.api.main:app --host 127.0.0.1 --port 8000 > /tmp/anchor-api.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/healthz > /tmp/anchor-health.json; then break; fi
            sleep 1
          done
          python -c 'import json; assert json.load(open("/tmp/anchor-health.json"))["liveProvidersEnabled"] is False'
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: python -m pip install uv==0.13.4
      - run: uv sync --frozen
      - run: uv run pip-audit
  containers:
    name: containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: docker compose -f infra/compose.yaml config --quiet
      - run: docker build -f infra/backend.Dockerfile -t anchor-fit-backend .
      - run: docker run --rm anchor-fit-backend .venv/bin/python -m apps.worker.main --check
      - run: docker build -f infra/web.Dockerfile -t anchor-fit-web .
