[project]
name = "anchor-fit"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "pydantic==2.14.2", "jsonschema==4.26.0", "sqlalchemy==2.1.6", "alembic==1.20.1", "psycopg[binary]==3.3.6", "boto3==1.43.122"]

[dependency-groups]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.3", "mypy==2.4.1", "types-jsonschema==4.26.0.20261006", "openapi-spec-validator==0.9.0", "pip-audit==2.10.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
testpaths = ["tests", "apps/api/tests", "apps/worker/tests", "services"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
files = ["contracts/runtime", "apps/api", "apps/worker", "services"]
